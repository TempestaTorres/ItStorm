<div #header id="it-storm-header" class="it-storm-section-header-sticky">
  <div class="header-wrapper color-option-1 gradient">
    <header class="header page-width">
      <!-- Logo -->
      <a class="heading-link" [routerLink]="['/']">
        <img
          src="/assets/images/Logotype.svg"
          class="heading-logo" alt="It Storm logo" loading="eager">
      </a>
      <!-- Headers -->
      <div class="headers">
        <!-- Navigation -->
        <div class="navigation-buttons">
         <nav class="main-navigation">
            <ul class="navigation-menu">
              <!-- Services -->
              <li>
                <a class="nav-menu-item list-menu__item header__menu-item header__menu-item--top"
                   routerLinkActive="header__active-menu-item"
                   ariaCurrentWhenActive="page"
                   [routerLinkActiveOptions]="{exact:true}"
                   [routerLink]="['/']">
                  <span class="label">Услуги</span>
                </a>
              </li>
              <!-- About us -->
              <li>
                <a class="nav-menu-item list-menu__item header__menu-item header__menu-item--top"
                   routerLinkActive="header__active-menu-item"
                   ariaCurrentWhenActive="page"
                   [routerLink]="['/about']">
                  <span class="label">О нас</span>
                </a>
              </li>
              <!-- Articles -->
              <li>
                <a class="nav-menu-item list-menu__item header__menu-item header__menu-item--top"
                   routerLinkActive="header__active-menu-item"
                   ariaCurrentWhenActive="page"
                   [routerLink]="['/blog']">
                  <span class="label">Статьи</span>
                </a>
              </li>
              <!-- Reviews -->
              <li>
                <a class="nav-menu-item list-menu__item header__menu-item header__menu-item--top"
                   routerLinkActive="header__active-menu-item"
                   ariaCurrentWhenActive="page"
                   [routerLink]="['/reviews']">
                  <span class="label">Отзывы</span>
                </a>
              </li>
              <!-- Contacts -->
              <li>
                <a class="nav-menu-item list-menu__item header__menu-item header__menu-item--top"
                   routerLinkActive="header__active-menu-item"
                   ariaCurrentWhenActive="page"
                   [routerLink]="['/contact']">
                  <span class="label">Контакты</span>
                </a>
              </li>
            </ul>
         </nav>
        </div>
        <!-- Action Icons -->
        <div class="header__icons">
          <!-- Phone -->
          <div class="header__icons__phone mobile-tablet-hidden">
            <a href="tel:74993431334"><span>+7 (499) 343-13-34</span></a>
          </div>
          <!-- Login -->
          <a class="header__icon header__icon__login" [class.active]="!loginStatus" [routerLink]="['/login']">
             <span title="login">
              <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.1399 21.62C17.2599 21.88 16.2199 22 14.9999 22H8.99986C7.77986 22 6.73986 21.88 5.85986 21.62C6.07986 19.02 8.74986 16.97 11.9999 16.97C15.2499 16.97 17.9199 19.02 18.1399 21.62Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M15 2H9C4 2 2 4 2 9V15C2 18.78 3.14 20.85 5.86 21.62C6.08 19.02 8.75 16.97 12 16.97C15.25 16.97 17.92 19.02 18.14 21.62C20.86 20.85 22 18.78 22 15V9C22 4 20 2 15 2ZM12 14.17C10.02 14.17 8.42 12.56 8.42 10.58C8.42 8.60002 10.02 7 12 7C13.98 7 15.58 8.60002 15.58 10.58C15.58 12.56 13.98 14.17 12 14.17Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M15.5799 10.58C15.5799 12.56 13.9799 14.17 11.9999 14.17C10.0199 14.17 8.41992 12.56 8.41992 10.58C8.41992 8.60002 10.0199 7 11.9999 7C13.9799 7 15.5799 8.60002 15.5799 10.58Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="icon-title">Войти</span>
          </a>
          <!-- Account -->
          <div class="header__icon header__icon__account" [class.active]="loginStatus">
            <menu-dropdown [menuType]="'ACCOUNT'"></menu-dropdown>
          </div>
        </div>
      </div>
    </header>
  </div>
</div>
