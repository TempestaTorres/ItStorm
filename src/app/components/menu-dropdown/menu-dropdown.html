<div class="menu-dropdown" [class.is-active]="active"
     (mouseover)="openDropdown()"
     (mouseleave)="closeDropdown()"
     (focusin)="openDropdown()"
     (focusout)="closeDropdown()">

  @if (menuType !== "ACCOUNT") {

    <a class="header__menu-item header__menu-item--top list-menu__item"
       routerLinkActive="header__active-menu-item"
       ariaCurrentWhenActive="page"
       [routerLink]="[menuLink]">
      <span class="label">About</span>
      <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" role="presentation" class="icon icon-caret" fill="none" viewBox="0 0 24 15">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 15c-.3 0-.6-.1-.8-.4l-11-13C-.2 1.2-.1.5.3.2c.4-.4 1.1-.3 1.4.1L12 12.5 22.2.4c.4-.4 1-.5 1.4-.1.4.4.5 1 .1 1.4l-11 13c-.1.2-.4.3-.7.3z" fill="currentColor"></path>
      </svg>
    </a>

  } @else {
    <a class="list-menu__item">
      <span title="account">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.1399 21.62C17.2599 21.88 16.2199 22 14.9999 22H8.99986C7.77986 22 6.73986 21.88 5.85986 21.62C6.07986 19.02 8.74986 16.97 11.9999 16.97C15.2499 16.97 17.9199 19.02 18.1399 21.62Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15 2H9C4 2 2 4 2 9V15C2 18.78 3.14 20.85 5.86 21.62C6.08 19.02 8.75 16.97 12 16.97C15.25 16.97 17.92 19.02 18.14 21.62C20.86 20.85 22 18.78 22 15V9C22 4 20 2 15 2ZM12 14.17C10.02 14.17 8.42 12.56 8.42 10.58C8.42 8.60002 10.02 7 12 7C13.98 7 15.58 8.60002 15.58 10.58C15.58 12.56 13.98 14.17 12 14.17Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15.5799 10.58C15.5799 12.56 13.9799 14.17 11.9999 14.17C10.0199 14.17 8.41992 12.56 8.41992 10.58C8.41992 8.60002 10.0199 7 11.9999 7C13.9799 7 15.5799 8.60002 15.5799 10.58Z" stroke="#071739" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="icon-title">Привет, {{ userName }}!</span>
    </a>
  }

  @if (menuType !== "ACCOUNT") {
    <!--  Menu -->
    <ul class="list-menu-dropdown list-menu" role="list" tabindex="-1">
      <li>
        <a [routerLink]="['/about']" class="header__menu-item list-menu__item">
          <span class="label">About us</span>
        </a>
      </li>
      <li>
        <a [routerLink]="['/contact']" class="header__menu-item list-menu__item">
          <span class="label">Contact</span>
        </a>
      </li>
      <li>
        <a [routerLink]="['/shipping-policy']" class="header__menu-item list-menu__item">
          <span class="label">Shipping & Delivery</span>
        </a>
      </li>
      <li>
        <a [routerLink]="['/faq']" class="header__menu-item list-menu__item">
          <span class="label">Faq</span>
        </a>
      </li>
    </ul>
  } @else {

    <!--  Menu -->
    <ul class="list-menu-dropdown list-menu account" role="list" tabindex="-1">
      <li>
        <a (click)="logout()" class="header__menu-item list-menu__item" tabindex="-1">
          <span class="label">Log out</span>
        </a>
      </li>
    </ul>
  }
</div>
